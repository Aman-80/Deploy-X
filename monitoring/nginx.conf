
server {
    listen 8080;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /containers/json {
        limit_except GET {
            deny all;
        }

        proxy_pass http://docker-socket-proxy:2375;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
